<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renit Resourcing</title>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <h1>Renit Resourcing</h1>
  <p>Microsoft Technology Talent & Project Delivery</p>
  <p>Website under development.</p>

  <script>
    if (window.netlifyIdentity) {

      // Initialize the widget
      window.netlifyIdentity.init();

      // Check URL hash for invite
      const hash = window.location.hash;
      if (hash && hash.includes("invite_token")) {
        // If invited, open signup modal
        window.netlifyIdentity.open("signup");
      } else {
        // If not invited, open login modal
        window.netlifyIdentity.open("login");
      }

      // Redirect to /admin after login
      window.netlifyIdentity.on("login", user => {
        window.location.href = "/admin/";
      });

      // Optional: redirect to homepage on logout
      window.netlifyIdentity.on("logout", () => {
        window.location.href = "/";
      });
    }
  </script>

</body>
</html>
